@if (totalPaginas() > 0) {
  <nav class="paginacao" aria-label="Paginação">
    <button
      type="button"
      class="botao"
      aria-label="Primeira página"
      [disabled]="pagina() === 1"
      (click)="ir(1)"
    >
      <mat-icon aria-hidden="true">first_page</mat-icon>
    </button>
    <button
      type="button"
      class="botao"
      aria-label="Página anterior"
      [disabled]="pagina() === 1"
      (click)="ir(pagina() - 1)"
    >
      <mat-icon aria-hidden="true">chevron_left</mat-icon>
    </button>

    @for (numero of numeros(); track numero) {
      <button
        type="button"
        class="botao"
        [class.atual]="numero === pagina()"
        [attr.aria-label]="'Página ' + numero"
        [attr.aria-current]="numero === pagina() ? 'page' : null"
        (click)="ir(numero)"
      >
        {{ numero }}
      </button>
    }

    <button
      type="button"
      class="botao"
      aria-label="Próxima página"
      [disabled]="pagina() === totalPaginas()"
      (click)="ir(pagina() + 1)"
    >
      <mat-icon aria-hidden="true">chevron_right</mat-icon>
    </button>
    <button
      type="button"
      class="botao"
      aria-label="Última página"
      [disabled]="pagina() === totalPaginas()"
      (click)="ir(totalPaginas())"
    >
      <mat-icon aria-hidden="true">last_page</mat-icon>
    </button>
  </nav>
}
