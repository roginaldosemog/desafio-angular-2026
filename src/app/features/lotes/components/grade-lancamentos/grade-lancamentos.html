<div class="area-rolavel" role="region" aria-label="Lançamentos do lote" tabindex="0">
  <table mat-table class="tabela" [dataSource]="linhas()">
    <ng-container matColumnDef="contaCorrente">
      <th mat-header-cell *matHeaderCellDef>Conta Corrente</th>
      <td mat-cell *matCellDef="let linha">{{ linha.contaCorrente }}</td>
    </ng-container>

    <ng-container matColumnDef="titular">
      <th mat-header-cell *matHeaderCellDef>Titular</th>
      <td mat-cell *matCellDef="let linha">{{ linha.titular }}</td>
    </ng-container>

    <ng-container matColumnDef="historico">
      <th mat-header-cell *matHeaderCellDef>Histórico</th>
      <td mat-cell *matCellDef="let linha">{{ linha.historico }}</td>
    </ng-container>

    <ng-container matColumnDef="valor">
      <th mat-header-cell *matHeaderCellDef class="numero">Valor</th>
      <td mat-cell *matCellDef="let linha" class="numero">{{ linha.valorCentavos | reais }}</td>
    </ng-container>

    <ng-container matColumnDef="documento">
      <th mat-header-cell *matHeaderCellDef>Documento</th>
      <td mat-cell *matCellDef="let linha">{{ linha.documento }}</td>
    </ng-container>

    <ng-container matColumnDef="situacao">
      <th mat-header-cell *matHeaderCellDef>Situação</th>
      <td mat-cell *matCellDef="let linha">{{ linha.situacao }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas" class="cabecalho"></tr>
    <tr mat-row *matRowDef="let linha; columns: colunas" class="linha"></tr>
    <tr *matNoDataRow>
      <td class="sem-registros" [attr.colspan]="colunas.length">Nenhum lançamento incluído.</td>
    </tr>
  </table>
</div>
