server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Rotas do Angular (como /contabil) não são arquivos: devolve o index.html e o roteador assume.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # O index.html sempre é revalidado, para o navegador buscar uma versão nova da aplicação.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # JavaScript, CSS e fontes têm hash no nome: podem ficar em cache por um ano.
  location ~* \.(?:js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
